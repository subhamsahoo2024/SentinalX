name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci_password
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sentinel -d sentinel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel_ci_password@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      SENTINEL_API_KEY: ci-test-key
      SENTINEL_URL: http://127.0.0.1:8000
      JWT_SECRET: ci-test-jwt-secret-key-32-chars-min
      ENABLE_DEMO_SANDBOX: "true"
      ALLOW_DEV_HEADERS: "true"
      LOOP_THRESHOLD_COUNT: "3"
      LOOP_WINDOW_SECONDS: "30"
      RUN_TOKEN_BUDGET: "5000"
      RUN_STALL_TIMEOUT_SEC: "25"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pybackend/uv.lock"

      - name: Install Python 3.12 and sync dependencies
        working-directory: pybackend
        run: |
          uv python install 3.12
          uv sync --locked --all-packages --dev

      - name: Run Ruff lint checks
        working-directory: pybackend
        run: uv run ruff check .

      - name: Run Alembic migrations
        working-directory: pybackend
        run: uv run --package sentinel-backend alembic -c backend/alembic.ini upgrade head

      - name: Run pytest suite
        working-directory: pybackend
        run: uv run --package sentinel-backend pytest -v

  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production Next.js build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/stream
        run: npm run build

