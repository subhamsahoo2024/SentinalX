[project]
name = "sentinalx"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "sdk",
    "backend",
    "demo_agents",
]

[tool.uv.sources]
sentinel-sdk = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
extend-exclude = ["backend/alembic"]
