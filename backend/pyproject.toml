    "redis>=8.1.0",
    "sentinel-sdk",
    "sqlalchemy[asyncio]>=2.1.9",
]

[tool.uv.sources]
sentinel-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"

